syntax = "proto3";

package test;

service Test {
  rpc UnaryCall(Input) returns (Output);
}

message Input {}
message Output {}

// Only goaway.rs uses this service, against a raw h2 server, so the other
// tests' implementations of Test need not grow a client-streaming method.
service GoawayTest {
  rpc UnaryCall(Input) returns (Output);
  rpc ClientStreamCall(stream Input) returns (Output);
}

service Test1 {
  rpc UnaryCall(Input1) returns (Output1);

  rpc StreamCall(Input1) returns (stream Output1);
}

message Input1 {
  bytes buf = 1;
}
message Output1 {
  bytes buf = 1;
}
